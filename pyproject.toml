[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault"
version = "0.1.0"
description = "Vault distributed password manager with Shamir Secret Sharing and AES-128-GCM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "click>=8.1,<9",
  "cryptography>=42,<47",
  "fastapi>=0.110,<1",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<4.11",
  "Pillow>=10,<12",
  "prompt_toolkit>=3.0,<4",
  "python-dotenv>=1.0,<2",
  "qrcode>=8,<9",
  "requests>=2.31,<3",
  "rich>=13,<15",
  "ruff>=0.7,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"